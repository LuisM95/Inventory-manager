#Inventory Manager CI/CD Pipeline 

name: Build and Push Inventory Manager
on:
  push: 
    branches: [develop]

jobs: 
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: Test_password
          POSTGRES_DB: test_inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s 
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SetUp Python 
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies 
        run: pip install -r requirements.txt

      - name: Run tests
        run: python3 -m pytest tests/ -v
        env:
          DATABASE_URL: postgresql://test_user:Test_password@localhost:5432/test_inventory
          REDIS_URL: redis://localhost:6379

  build-and-push:
    runs-on: ubuntu-latest
    needs: test 
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v4

      - name: Configure Aws Credentials 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_KEY}}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push to ECR
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
        run: |
          docker build -t $ECR_REGISTRY/inventory_manager:latest .
          docker push $ECR_REGISTRY/inventory_manager:latest 

